<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>FREED</title>
<meta name="description" content="FREED — Talk to someone who knows. A calm, living marketplace that helps you find a verified person who can actually help — and talk now or book later." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   FREED — design tokens (calm, humanist, alive)
   ============================================================ */
:root{
  --pink:#FF9FAE; --pink-soft:#FFE7EA;
  --green:#6FC077; --green-deep:#3E9A57; --green-mid:#B6E6AB; --green-light:#D6F4C6;
  --cream:#FBFFDD; --sun:#FFD98A;
  --bg:#FFFEFB; --bg2:#FBFAF4;
  --surface:#FFFFFF; --glass:rgba(255,255,255,.72);
  --ink:#232B26; --ink2:#5C685F; --ink3:#93A096;
  --line:#EFEBE1; --line2:#E5E0D4;
  --avail:#2FA24C;
  --danger:#E76A72;
  --sh-1:0 1px 2px rgba(35,43,38,.04),0 4px 14px rgba(35,43,38,.05);
  --sh-2:0 8px 30px rgba(35,43,38,.09);
  --sh-3:0 24px 60px rgba(35,43,38,.16);
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:13px; --pill:999px;
  --fb:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --fl:'Unbounded',var(--fb);
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--fb);color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;display:flex;align-items:center;justify-content:center;letter-spacing:0;
}
#phone{
  position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;max-height:940px;
  background:
    radial-gradient(120% 60% at 12% -6%, #FFEEF0 0%, transparent 46%),
    radial-gradient(120% 60% at 100% 2%, #ECFAE3 0%, transparent 42%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:520px){
  body{padding:24px;background:#0d0f0e}
  #phone{height:912px;border-radius:44px;box-shadow:var(--sh-3),0 0 0 11px #17191a,0 0 0 13px #2c2f30}
}
#app{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#app::-webkit-scrollbar{width:0}
.view{min-height:100%;display:flex;flex-direction:column;will-change:transform,opacity}
.pad{padding:0 22px}
.gap-nav{padding-bottom:104px}.gap-cta{padding-bottom:128px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- type ---------- */
h1,h2,h3,h4{margin:0;color:var(--ink);letter-spacing:-.015em;font-weight:700}
.logo{font-family:var(--fl);font-weight:800;letter-spacing:.01em}
.d1{font-size:29px;line-height:1.14;font-weight:800;letter-spacing:-.02em}
.h1{font-size:25px;line-height:1.18;font-weight:700;letter-spacing:-.018em}
.h2{font-size:20px;line-height:1.22;font-weight:700;letter-spacing:-.014em}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--ink3);letter-spacing:0}
.lead{font-size:15.5px;color:var(--ink2);line-height:1.55}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}
.tiny{font-size:12px}.small{font-size:13.5px}
.num{font-family:var(--fb);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.cap{font-weight:600}

/* ---------- buttons ---------- */
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--fb);font-weight:600;font-size:15px;
  letter-spacing:.02em;border-radius:var(--pill);padding:15px 22px;display:inline-flex;align-items:center;
  justify-content:center;gap:9px;line-height:1;color:var(--ink);position:relative;overflow:hidden;
  transition:transform .14s var(--ease),box-shadow .25s var(--ease),background .25s,filter .2s;user-select:none}
.btn:active{transform:scale(.965)}
.btn-lg{padding:17px 24px;font-size:16px}
.btn.small{padding:10px 16px;font-size:13.5px}
.btn-primary{background:linear-gradient(180deg,#7ECB83,var(--green));color:#0c2a12;box-shadow:0 8px 20px rgba(111,192,119,.4)}
.btn-primary:active{box-shadow:0 4px 12px rgba(111,192,119,.34)}
.btn-dark{background:var(--ink);color:#fff}
.btn-pink{background:linear-gradient(180deg,#FFB3BC,var(--pink));color:#5c1e26;box-shadow:0 8px 20px rgba(255,159,174,.4)}
.btn-ghost{background:var(--surface);border:1px solid var(--line2);color:var(--ink)}
.btn-soft{background:var(--cream);color:var(--ink)}
.btn-block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.55);pointer-events:none;animation:rip .6s ease-out}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);cursor:pointer;color:var(--ink);transition:transform .14s var(--ease),background .2s;flex:0 0 auto}
.iconbtn:active{transform:scale(.88)}
.link{background:none;border:0;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer;padding:8px;letter-spacing:0}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border-radius:var(--pill);background:var(--surface);
  border:1px solid var(--line2);font-size:14px;font-weight:600;letter-spacing:0;cursor:pointer;color:var(--ink);white-space:nowrap;
  transition:transform .16s var(--ease),background .2s,color .2s,border-color .2s;user-select:none}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.tint{background:var(--green-light);border-color:transparent;color:#2c5b30}
.chip.tint.on{background:var(--green);color:#0c2a12}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:var(--pill);letter-spacing:0}
.b-verify{background:#E7F6EA;color:#2c7d3a}.b-pink{background:var(--pink-soft);color:#a5495a}
.b-cream{background:#FBF6D8;color:#7a7620}.b-gray{background:#F2F0E9;color:var(--ink2)}
.divider{height:1px;background:var(--line);margin:18px 0}
.row{display:flex;align-items:center;gap:12px}.between{display:flex;align-items:center;justify-content:space-between}
.wrap{display:flex;flex-wrap:wrap;gap:9px}.grow{flex:1;min-width:0}.center{text-align:center}
.stack>*+*{margin-top:14px}.stack-s>*+*{margin-top:9px}
.stars{color:#F1B33C;letter-spacing:1px}
.avatar{border-radius:50%;display:grid;place-items:center;font-family:var(--fb);font-weight:700;color:#fff;flex:0 0 auto;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 6px 16px rgba(35,43,38,.12);position:relative}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:2px 22px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:0 0 auto}

/* living dot */
.dot{width:9px;height:9px;border-radius:50%;background:var(--avail);position:relative}
.dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--avail);opacity:.4;animation:breathe 2.4s var(--ease) infinite}
@keyframes breathe{0%{transform:scale(.6);opacity:.5}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
.avail{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--avail);letter-spacing:0}

/* topbar / nav */
.topbar{position:sticky;top:0;z-index:20;padding:16px 22px 10px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(var(--bg) 72%,transparent)}
.topbar.solid{background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:40;display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  background:var(--glass);backdrop-filter:blur(22px);border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:5px 0;color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:0;transition:color .2s}
.nav button.on{color:var(--ink)}
.nav .ic{transition:transform .3s var(--ease-spring)}
.nav button.on .ic{transform:translateY(-2px)}
.nav .pip{width:5px;height:5px;border-radius:50%;background:var(--green);opacity:0;transform:scale(0);transition:.3s var(--ease-spring)}
.nav button.on .pip{opacity:1;transform:scale(1)}
.ctabar{position:absolute;left:0;right:0;bottom:0;z-index:45;padding:14px 22px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 34%);display:flex;gap:10px}

/* inputs */
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line2);border-radius:22px;
  padding:17px 19px;box-shadow:var(--sh-1);cursor:text;transition:box-shadow .25s,border-color .25s,transform .2s}
.search:focus-within{border-color:var(--green-mid);box-shadow:0 0 0 4px rgba(182,230,171,.35)}
.search input,.search textarea{border:0;outline:0;font:inherit;font-size:15.5px;flex:1;background:none;color:var(--ink);min-width:0;resize:none}
.search input::placeholder{color:var(--ink3)}
.field{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:14px;padding:15px 16px;font:inherit;
  font-size:15.5px;color:var(--ink);outline:0;transition:border .2s,box-shadow .2s}
.field:focus{border-color:var(--green-mid);box-shadow:0 0 0 4px rgba(182,230,171,.32)}
textarea.field{min-height:100px;line-height:1.55}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 7px 2px;letter-spacing:0}

/* expert card */
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px;box-shadow:var(--sh-1);
  transition:transform .18s var(--ease),box-shadow .25s}
.ecard:active{transform:scale(.988)}
.pop{width:262px;border-radius:var(--r-lg)}
.tile{border-radius:var(--r-lg);padding:18px;cursor:pointer;border:1px solid transparent;position:relative;overflow:hidden;
  transition:transform .18s var(--ease)}
.tile:active{transform:scale(.97)}

/* sheet */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(24,28,24,.44);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:30px 30px 0 0;box-shadow:var(--sh-3);
  transform:translateY(103%);max-height:90%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
  touch-action:none;will-change:transform}
.sheet.show{transform:translateY(0);transition:transform .42s var(--ease-spring)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line2);margin:11px auto 2px}
.sheet-body{overflow-y:auto;padding:8px 22px 24px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}

/* toast */
#toasts{position:absolute;left:0;right:0;bottom:112px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;padding:0 22px}
.toast{background:var(--ink);color:#fff;padding:13px 18px;border-radius:15px;font-size:13.5px;font-weight:600;letter-spacing:0;
  box-shadow:var(--sh-3);display:flex;align-items:center;gap:9px;max-width:100%}

/* skeleton */
.sk{background:linear-gradient(100deg,#efeadf 30%,#f8f5ec 50%,#efeadf 70%);background-size:200% 100%;animation:shim 1.3s infinite;border-radius:12px}
@keyframes shim{to{background-position:-200% 0}}

/* blobs / splash */
.blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.85;mix-blend-mode:multiply;will-change:transform}
.float{animation:float 10s var(--ease) infinite}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(16px,-22px) scale(1.07)}66%{transform:translate(-14px,14px) scale(.95)}}

/* progress / dots */
.prog{height:7px;background:var(--line);border-radius:7px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--green-mid),var(--green));border-radius:7px;transition:width .5s var(--ease)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:all .35s var(--ease-spring)}
.dots i.on{width:26px;border-radius:7px;background:var(--ink)}

/* consult */
.stage{flex:1;display:flex;flex-direction:column;color:#fff;
  background:radial-gradient(130% 80% at 50% -10%,#33463a,#161e19)}
.cc{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:0;color:#fff;
  cursor:pointer;transition:transform .14s var(--ease),background .2s}
.cc:active{transform:scale(.88)}.cc.off{background:#fff;color:var(--ink)}.cc.end{background:var(--danger)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .c{aspect-ratio:1;border-radius:13px;display:grid;place-items:center;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);position:relative;transition:transform .14s var(--ease),background .2s}
.cal .c:active{transform:scale(.9)}
.cal .c.mut{color:var(--ink3);pointer-events:none;opacity:.4}
.cal .c.on{background:var(--ink);color:#fff}
.cal .c.has::after{content:'';position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--green)}
.cal .c.on.has::after{background:#fff}
.cal .hd{text-align:center;font-size:11px;color:var(--ink3);font-weight:700;padding-bottom:4px}
.slot{padding:13px;border-radius:14px;border:1px solid var(--line2);text-align:center;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface);transition:transform .14s var(--ease),background .2s}
.slot:active{transform:scale(.94)}.slot.on{background:var(--green);border-color:var(--green);color:#0c2a12}

/* chat */
.bubble{max-width:80%;padding:12px 15px;border-radius:20px;font-size:14.5px;line-height:1.45;box-shadow:var(--sh-1)}
.bubble.me{background:linear-gradient(180deg,#7ECB83,var(--green));color:#0c2a12;border-bottom-right-radius:6px;align-self:flex-end}
.bubble.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.composer{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;gap:9px;align-items:flex-end;
  padding:11px 15px calc(13px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(18px);border-top:1px solid var(--line)}

.toggle{width:50px;height:29px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:background .25s;flex:0 0 auto}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform .28s var(--ease-spring)}
.toggle.on{background:var(--green)}.toggle.on::after{transform:translateX(21px)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line2);border-radius:var(--pill);padding:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:var(--pill);font:inherit;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer;transition:.2s;letter-spacing:0}
.seg button.on{background:var(--ink);color:#fff}
.tickrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.tickrow:last-child{border-bottom:0}
.tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.disc{background:var(--pink-soft);border-radius:15px;padding:13px 15px;font-size:12.5px;line-height:1.5;color:#8a4b54}
.glassnudge{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1)}
svg{display:block}.hide{display:none!important}
img,svg,video{max-width:100%}
/* ---------- responsive: fully mobile-first, scales to any phone ---------- */
@media (max-width:410px){
  .pad{padding:0 18px}.hscroll{padding-left:18px;padding-right:18px}
  .topbar{padding-left:18px;padding-right:18px}.ctabar{padding-left:18px;padding-right:18px}
  .d1{font-size:26px}.h1{font-size:23px}.h2{font-size:19px}
  .search{padding:15px 16px}.ecard{padding:15px}
}
@media (max-width:350px){
  .d1{font-size:23px}.h2{font-size:18px}
  .btn{font-size:14px;padding:14px 18px}.btn-lg{padding:15px 20px;font-size:15px}
  .chip{padding:10px 13px;font-size:13px}.pop{width:220px}
  .nav button{font-size:9.5px}
}
@media (min-height:850px){.gap-nav{padding-bottom:110px}}
</style>
</head>
<body>
<div id="phone">
  <div id="app"></div>
  <div id="nav-slot"></div>
  <div id="toasts"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-body" id="sheet-body"></div></div>
</div>
<script>
/* ==========================================================================
   FREED — a living, calm consultation marketplace (rebuilt from scratch)
   Emphasis: motion/micro-interactions + smart, dynamic content.
   ========================================================================== */
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$("#app"), navSlot=$("#nav-slot");
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const rupee=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const haptic=(ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
const store={get:k=>{try{return JSON.parse(localStorage.getItem("freed_"+k));}catch(e){return null;}},
  set:(k,v)=>{try{localStorage.setItem("freed_"+k,JSON.stringify(v));}catch(e){}}};

/* ---------- icons ---------- */
const I={
 home:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/>',
 compass:'<circle cx="12" cy="12" r="8.5"/><path d="m15 9-2 4-4 2 2-4 4-2Z"/>',
 cal:'<rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3.5v4M16 3.5v4"/>',
 chat:'<path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H9l-4 3.5V7A1.5 1.5 0 0 1 5 5.5Z"/>',
 user:'<circle cx="12" cy="8.5" r="3.7"/><path d="M5.5 20c.7-3.6 3.3-5.5 6.5-5.5s5.8 1.9 6.5 5.5"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
 shield:'<path d="M12 3.5 5 6v5c0 5 3.2 8 7 9.5 3.8-1.5 7-4.5 7-9.5V6l-7-2.5Z"/>',check:'<path d="M5 12.5 10 17l9-10"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',phone:'<path d="M6 4h3l1.5 4-2 1.5a11 11 0 0 0 5 5l1.5-2 4 1.5V18a2 2 0 0 1-2 2A15 15 0 0 1 4 6a2 2 0 0 1 2-2Z"/>',
 video:'<rect x="3.5" y="6.5" width="12" height="11" rx="2.5"/><path d="m15.5 10 5-2.5v9L15.5 14"/>',
 mic:'<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
 micoff:'<path d="M9 5a3 3 0 0 1 6 0v5M5.5 11a6.5 6.5 0 0 0 9 6M4 4l16 16M12 17.5V21"/>',
 spk:'<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 9a4 4 0 0 1 0 6"/>',cam:'<rect x="3.5" y="6.5" width="12" height="11" rx="2.5"/><path d="m15.5 10 5-2.5v9L15.5 14"/>',

const anim=(el,frames,opts)=>{if(!el||reduce||!el.animate)return{finished:Promise.resolve()};try{return el.animate(frames,opts);}catch(e){return{finished:Promise.resolve()};}};
function countUp(el){
 if(!el)return;const to=+el.dataset.count;if(reduce){el.textContent=el.dataset.fmt==="k"?(to/1000).toFixed(1)+"k":to.toLocaleString("en-IN");return;}
 const dur=800,t0=performance.now();
 const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3),val=to*e;
  el.textContent=el.dataset.fmt==="k"?(val/1000).toFixed(1)+"k":Math.round(val).toLocaleString("en-IN");
  if(p<1)requestAnimationFrame(step);};
 requestAnimationFrame(step);
}
let typeTimer=null;
function typewriter(input,phrases){
 clearInterval(typeTimer);if(!input)return;let pi=0,ci=0,del=false;
 const tick=()=>{const p=phrases[pi];input.setAttribute("placeholder",p.slice(0,ci)+(ci<p.length&&!del?"▎":""));
  if(!del){ci++;if(ci>p.length){del=true;setTimeout(tick,1400);return;}}
  else{ci--;if(ci<=0){del=false;pi=(pi+1)%phrases.length;}}
  typeTimer=setTimeout(tick,del?34:reduce?9999:64);};
 if(reduce){input.setAttribute("placeholder",phrases[0]);return;}tick();
}

/* booking */
function daysGrid(){const first=new Date(2026,8,1),dow=first.getDay(),cells=[];for(let i=0;i<dow;i++)cells.push(null);for(let d=1;d<=30;d++)cells.push(d);return cells;}
function dLabel(d){const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(2026,8,d).getDay()];return `${wd}, ${d} Sep`;}
SCREENS.booking=()=>{const e=byId(state.expertId);if(!e)return SCREENS.home();const b=state.booking||(state.booking={expertId:e.id});
 const slots=["10:00 AM","10:30 AM","11:00 AM","12:30 PM","2:00 PM","3:30 PM","5:00 PM","6:30 PM"];
 const durs=[["30 min",e.s30],["45 min",Math.round(e.s30*1.4/50)*50],["60 min",e.s60]];const ready=b.date&&b.time&&b.dur;
 return `<div class="view gap-cta">${header("Book a session",{solid:true})}
  <div class="pad"><div class="card row" data-stagger style="padding:12px;margin-bottom:18px">${avatarEl(e,44)}<div class="grow"><b class="small">${esc(e.name)}</b><div class="tiny dim">${esc(e.role)}</div></div>${classBadge(e)}</div>

   ${b.date?`<h3 class="h2" style="margin:22px 0 12px">Pick a time · ${b.date}</h3><div class="wrap" style="display:grid;grid-template-columns:repeat(3,1fr)">${slots.map(s=>`<button class="slot ${b.time===s?'on':''}" data-slot="${s}">${s}</button>`).join("")}</div>`:""}
   ${b.time?`<h3 class="h2" style="margin:22px 0 12px">Duration</h3><div class="wrap" style="display:grid;grid-template-columns:repeat(3,1fr)">${durs.map(([l,p])=>`<button class="slot ${b.dur===l?'on':''}" data-dur="${l}|${p}"><div>${l}</div><div class="tiny ${b.dur===l?'':'dim'}" style="margin-top:3px">${rupee(p)}</div></button>`).join("")}</div>`:""}</div>

  <div class="ctabar">${ready?`<button class="btn btn-primary btn-block btn-lg" data-confirmbk>Confirm booking · ${rupee(b.amount)}</button>`:`<button class="btn btn-soft btn-block btn-lg" disabled>Select date, time & duration</button>`}</div></div>`;};

function openSheet(html){$("#sheet-body").innerHTML=html;$("#scrim").classList.add("show");$("#sheet").classList.add("show");
 const sh=$("#sheet");sh.style.transform="";$$(".btn",sh).forEach(b=>b.addEventListener("pointerdown",e=>{if(reduce)return;const r=b.getBoundingClientRect(),sz=Math.max(r.width,r.height);const s=document.createElement("span");s.className="ripple";s.style.width=s.style.height=sz+"px";s.style.left=(e.clientX-r.left-sz/2)+"px";s.style.top=(e.clientY-r.top-sz/2)+"px";b.appendChild(s);setTimeout(()=>s.remove(),600);}));}
function closeSheet(){$("#scrim").classList.remove("show");$("#sheet").classList.remove("show");$("#sheet").style.transform="";}
function toast(msg){const w=$("#toasts"),t=document.createElement("div");t.className="toast";t.innerHTML=`${ic("check",15)}<span>${esc(msg)}</span>`;w.appendChild(t);
 anim(t,[{opacity:0,transform:"translateY(14px) scale(.96)"},{opacity:1,transform:"none"}],{duration:300,easing:"cubic-bezier(.34,1.56,.64,1)"});
 haptic(6);setTimeout(()=>{const a=anim(t,[{opacity:1},{opacity:0,transform:"translateY(8px)"}],{duration:280});if(a.finished)a.finished.then(()=>t.remove());else t.remove();},2100);}

  ${[["chat","Instant chat",e.rate,"chat"],["audio","Instant audio call",e.rate+5,"phone"],["video","Instant video call",e.rate+8,"video"]].map(([k,l,p,i])=>`<button class="card between" data-startmode="${e.id}|${k}" style="padding:15px;width:100%;text-align:left;margin-bottom:10px;cursor:pointer"><div class="row">${ic(i,19)}<div><b class="small">${l}</b><div class="tiny dim">Pay per minute</div></div></div><b class="num">${rupee(p)}<span class="tiny dim">/min</span></b></button>`).join("")}
